"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "./.conductor/setup.sh"
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port ${CONDUCTOR_PORT:-3000}"
available_in = [ "local" ]
default = true
icon = "play"

[scripts.run.build]
command = "npm run build"
icon = "hammer"

[scripts.run.prod]
command = "npm run build && npm run start -- --port ${CONDUCTOR_PORT:-3000}"
available_in = [ "local" ]
icon = "rocket"
